<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Santosh Yadav</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #ffd700;
            --secondary-color: #ffffff;
            --background-color: #0a0a0a;
            --text-color: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            padding: 3rem 2rem;
            background: rgba(255, 215, 0, 0.03);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem;
        }

        .profile-top-box {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 2rem 0 4rem;
            position: relative;
        }

        .profile-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            position: relative;
            border: 4px solid var(--primary-color);
            box-shadow: 0 0 0 10px rgba(255, 215, 0, 0.1);
            transition: var(--transition);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.05);
        }

        .profile-image:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .profile-image:hover img {
            transform: scale(1.1);
        }

        .profile-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border-radius: 50%;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .profile-image:hover::before {
            opacity: 0;
        }

        .profile-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .profile-image:hover .profile-overlay {
            opacity: 1;
        }

        .overlay-content {
            text-align: center;
            color: #ffffff;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }

        .social-icon {
            color: #ffffff;
            font-size: 1.5rem;
            transition: color 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.2);
        }

        .social-icon:hover {
            color: #ffd700;
            transform: scale(1.2);
            background: rgba(255, 215, 0, 0.4);
        }

        .profile-info {
            margin-top: 2rem;
            padding: 0 2rem;
        }

        .profile-info h2 {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .profile-info p {
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .contact-form {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .contact-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.1), transparent);
            pointer-events: none;
        }

        .contact-form h2 {
            color: var(--primary-color);
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2.5rem;
            position: relative;
            cursor: pointer;
        }

        .contact-form h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: #ffd700;
            transition: width 0.3s ease;
        }

        .contact-form h2:hover::after {
            width: 80px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
            outline: none;
        }

        .form-group input:invalid,
        .form-group textarea:invalid {
            border-color: #ff4444;
        }

        .form-group input:valid,
        .form-group textarea:valid {
            border-color: #4CAF50;
        }

        .form-group .error {
            color: #ff4444;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .form-group .error.show {
            display: block;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
            outline: none;
        }

        .form-group textarea {
            height: 200px;
            resize: vertical;
            min-height: 150px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: var(--background-color);
            padding: 1.2rem 3rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: var(--transition);
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: auto;
        }

        .submit-btn i {
            transition: transform 0.3s ease;
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .submit-btn.loading i {
            animation: spin 1s linear infinite;
        }

        .submit-btn:hover i {
            transform: rotate(180deg);
        }

        .success-message,
        .error-message {
            display: none;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            padding: 1rem;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            transition: var(--transition);
            margin-top: auto;
        }

        .social-links:hover {
            transform: translateY(-5px);
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.5rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .social-links a:hover {
            color: #ffd700;
        }

        .social-links a::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-links a:hover::before {
            opacity: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .submit-btn:hover::before {
            width: 200%;
            height: 200%;
        }

        .social-links {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-links a {
            color: #ffffff;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #ffd700;
        }

        @media (max-width: 992px) {
            .contact-container {
                flex-direction: column;
                gap: 4rem;
                padding: 2rem;
            }

            .profile-section {
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
            }

            .contact-form {
                padding: 2rem;
            }
        }

        @media (max-width: 768px) {
            .profile-image {
                width: 250px;
                height: 250px;
            }

            .contact-form h2 {
                font-size: 2rem;
            }
        }
    </style>
    <script>
        // Form validation and submission
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contactForm');
            const successMessage = document.createElement('div');
            const errorMessage = document.createElement('div');
            
            // Add classes for styling
            successMessage.className = 'success-message';
            errorMessage.className = 'error-message';
            
            // Add to form
            form.appendChild(successMessage);
            form.appendChild(errorMessage);

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Get form data
                const formData = new FormData(form);
                const name = formData.get('name').trim();
                const email = formData.get('email').trim();
                const message = formData.get('message').trim();

                // Validate inputs
                if (!name || !email || !message) {
                    showError('All fields are required!');
                    return;
                }

                if (!validateEmail(email)) {
                    showError('Please enter a valid email address!');
                    return;
                }

                // Show loading state
                const submitBtn = form.querySelector('.submit-btn');
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = '<i class="fas fa-spinner"></i> Sending...';

                // Simulate form submission
                setTimeout(() => {
                    showSuccess('Message sent successfully!');
                    form.reset();
                    submitBtn.classList.remove('loading');
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
                }, 2000);
            });

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }

            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            }

            // Copy to clipboard functionality
            function copyToClipboard(text) {
                navigator.clipboard.writeText(text)
                    .then(() => {
                        const copyBtn = document.querySelector('.copy-btn');
                        const originalIcon = copyBtn.querySelector('i').className;
                        copyBtn.querySelector('i').className = 'fas fa-check';
                        setTimeout(() => {
                            copyBtn.querySelector('i').className = originalIcon;
                        }, 1000);
                    })
                    .catch(err => {
                        console.error('Failed to copy text: ', err);
                    });
            }
        });

        // Smooth scroll to form
        document.querySelector('.contact-form h2').addEventListener('click', function() {
            document.querySelector('.contact-form').scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        });
    </script>
</head>
<body>
    <a href="about.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to About
    </a>

    <div class="contact-container">
        <div class="profile-section">
            <div class="profile-image">
                <img src="./assets/contact/profile.jpg" alt="Santosh Yadav" class="profile-img" onerror="this.onerror=null;this.src='../../assets/contact/profile.jpg';">
                <div class="profile-overlay">
                    <div class="overlay-content">
                        <div class="social-links">
                            <a href="https://github.com/sannpl/saroj.git" target="_blank" class="social-icon"><i class="fab fa-github"></i></a>
                            <a href="https://www.facebook.com/share/1C8hoxzSQh/" target="_blank" class="social-icon"><i class="fab fa-facebook"></i></a>
                            <a href="https://www.tiktok.com/@santoshyadav25800?_t=ZS-8wSA6Ek3f7p&_r=1" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>
                            <a href="https://www.instagram.com/santosh11112322?igsh=ZWo1eXh0d3llNWk2" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="profile-info">
                <h2>Santosh Yadav</h2>
                <p>Full Stack Developer</p>
                <p>Adarsh Secondary School, Biratnagar - 07</p>
            </div>
        </div>

        <div class="contact-form">
            <h2>Get in Touch</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
