<!DOCTYPE html>
<html>
<head>
    <title>Profile Image Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }

        .image-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .image-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .image-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), transparent, rgba(255, 255, 255, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-container:hover::before {
            opacity: 1;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }

        img:hover {
            transform: scale(1.05);
        }

        .controls {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .image-container:hover .controls {
            bottom: 20px;
            opacity: 1;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="assets/img/profile-large.png" alt="Profile Picture">
        <div class="controls">
            <button class="control-btn" onclick="window.open('https://www.canva.com/', '_blank')">Edit in Canva</button>
            <button class="control-btn" onclick="window.open('https://www.adobe.com/express/create/photo', '_blank')">Edit in Adobe</button>
        </div>
    </div>
</body>
</html>
